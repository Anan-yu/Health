# Isolated remote development stack.
# Run with: docker compose --env-file .env.remote-dev \
#   -f compose.yml -f compose.remote-dev.yml up -d --no-build
#
# This overlay deliberately keeps the production stack untouched: it uses a
# separate Compose project, named data volumes and a localhost-only gateway.
services:
  mysql:
    ports: []
  redis:
    ports: []
  minio:
    ports: []
  rayk-ai:
    ports: []
    environment:
      # Keep OCR aligned with production's dedicated OCR model while the
      # assistant and vision services use qwen3.8-flash.
      QWEN_OCR_MODEL: "qwen3.5-ocr"
  rayk-server:
    ports: []
    environment:
      RAYK_DEVELOPMENT_LOGIN_ENABLED: "true"
      MEMBERSHIP_DEVELOPMENT_MODE: "true"
      GOLD_BEAN_ENABLED: "true"
      GOLD_BEAN_DEVELOPMENT_MODE: "true"
      # Keep the isolated environment safe by default, while allowing an
      # explicit test deployment to mirror the production payment feature
      # flags through .env.remote-dev.
      GOLD_BEAN_PAYMENT_ENABLED: "${REMOTE_DEV_GOLD_BEAN_PAYMENT_ENABLED:-false}"
      GOLD_BEAN_REGISTRATION_FEE_CENT: "${REMOTE_DEV_GOLD_BEAN_REGISTRATION_FEE_CENT:-100000}"
      GOLD_BEAN_PLATFORM_REGISTRATION_FEE_CENT: "${REMOTE_DEV_GOLD_BEAN_PLATFORM_REGISTRATION_FEE_CENT:-100000}"
      GOLD_BEAN_VIRTUAL_PAYMENT_SURCHARGE_PERCENT: "${REMOTE_DEV_GOLD_BEAN_VIRTUAL_PAYMENT_SURCHARGE_PERCENT:-12}"
      GOLD_BEAN_REGISTRATION_PRODUCT_ID: "${REMOTE_DEV_GOLD_BEAN_REGISTRATION_PRODUCT_ID:-}"
      GOLD_BEAN_REFERRAL_REGISTRATION_PRODUCT_ID: "${REMOTE_DEV_GOLD_BEAN_REFERRAL_REGISTRATION_PRODUCT_ID:-}"
      GOLD_BEAN_PRODUCT_ID: "${REMOTE_DEV_GOLD_BEAN_PRODUCT_ID:-}"
      GOLD_BEAN_UNIT_PRICE_CENT: "${REMOTE_DEV_GOLD_BEAN_UNIT_PRICE_CENT:-100}"
      GOLD_BEAN_MAX_PURCHASE_QUANTITY: "${REMOTE_DEV_GOLD_BEAN_MAX_PURCHASE_QUANTITY:-10000}"
      GOLD_BEAN_TRADE_PAYMENT_ENABLED: "${REMOTE_DEV_GOLD_BEAN_TRADE_PAYMENT_ENABLED:-false}"
      GOLD_BEAN_TRADE_TRANSFER_SCENE_ID: "${REMOTE_DEV_GOLD_BEAN_TRADE_TRANSFER_SCENE_ID:-}"
      GOLD_BEAN_TRADE_TRANSFER_NOTIFY_URL: "${REMOTE_DEV_GOLD_BEAN_TRADE_TRANSFER_NOTIFY_URL:-}"
      GOLD_BEAN_TRADE_TRANSFER_USER_RECV_PERCEPTION: "${REMOTE_DEV_GOLD_BEAN_TRADE_TRANSFER_USER_RECV_PERCEPTION:-劳务报酬}"
      GOLD_BEAN_TRADE_TRANSFER_JOB_TYPE: "${REMOTE_DEV_GOLD_BEAN_TRADE_TRANSFER_JOB_TYPE:-金豆交易服务}"
      GOLD_BEAN_TRADE_TRANSFER_REWARD_DESCRIPTION: "${REMOTE_DEV_GOLD_BEAN_TRADE_TRANSFER_REWARD_DESCRIPTION:-金豆交易结算}"
      GOLD_BEAN_TRADE_SETTLEMENT_RETRY_SECONDS: "${REMOTE_DEV_GOLD_BEAN_TRADE_SETTLEMENT_RETRY_SECONDS:-30}"
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_ENABLED: "${REMOTE_DEV_GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_ENABLED:-false}"
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_SCENE_ID: "${REMOTE_DEV_GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_SCENE_ID:-}"
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_NOTIFY_URL: "${REMOTE_DEV_GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_NOTIFY_URL:-}"
      GOLD_BEAN_REGISTRATION_REFERRAL_AUTHORIZATION_NOTIFY_URL: "${REMOTE_DEV_GOLD_BEAN_REGISTRATION_REFERRAL_AUTHORIZATION_NOTIFY_URL:-https://xingxuyuan.com/test-api/api/payments/wechat/merchant-transfer/authorization-notify}"
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_USER_RECV_PERCEPTION: "${REMOTE_DEV_GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_USER_RECV_PERCEPTION:-劳务报酬}"
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_JOB_TYPE: "${REMOTE_DEV_GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_JOB_TYPE:-推荐注册服务}"
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_REWARD_DESCRIPTION: "${REMOTE_DEV_GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_REWARD_DESCRIPTION:-推荐注册服务报酬}"
      GOLD_BEAN_ROBOT_GROUP_NAME: "${REMOTE_DEV_GOLD_BEAN_ROBOT_GROUP_NAME:-机器人权益服务群}"
      # The isolated test package ships the QR image, so the test backend must
      # return the bundled-asset marker when no externally hosted group QR is set.
      GOLD_BEAN_ROBOT_GROUP_QR_IMAGE_URL: "${REMOTE_DEV_GOLD_BEAN_ROBOT_GROUP_QR_IMAGE_URL:-asset://robot-group-qr}"
      RAYK_HEALTH_TREE_HOLE_FEEDBACK_CRON: "${REMOTE_DEV_RAYK_HEALTH_TREE_HOLE_FEEDBACK_CRON:-0 15 2 * * *}"
      WECHAT_VIRTUAL_NOTIFY_URL: "${REMOTE_DEV_WECHAT_VIRTUAL_NOTIFY_URL:-https://xingxuyuan.com/test-api/api/payments/wechat/virtual/notify}"
      WECHAT_VIRTUAL_PUSH_TOKEN: "${REMOTE_DEV_WECHAT_VIRTUAL_PUSH_TOKEN:-}"
      MEMBERSHIP_PAYMENT_ENABLED: "${REMOTE_DEV_MEMBERSHIP_PAYMENT_ENABLED:-false}"
      MALL_ENABLED: "${REMOTE_DEV_MALL_ENABLED:-false}"
      MALL_PAYMENT_ENABLED: "${REMOTE_DEV_MALL_PAYMENT_ENABLED:-false}"
      WECHAT_MOCK_ENABLED: "false"
      WECHAT_AUTO_BIND_USERNAME: ""
  nginx:
    volumes:
      # Keep the isolated test UI separate from the production H5 bind mount.
      - ./rayk-miniapp/dist/build/h5-remote-dev:/usr/share/nginx/html:ro
    ports:
      # Bind only to Docker's host bridge; production Nginx reaches this via
      # host.docker.internal while the test gateway is not Internet-exposed.
      - "${REMOTE_DEV_BIND_ADDRESS:-172.17.0.1}:${REMOTE_DEV_GATEWAY_PORT:-18081}:80"
