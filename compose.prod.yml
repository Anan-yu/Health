services:
  mysql:
    ports: []
  redis:
    ports: []
  minio:
    ports: []
  rayk-ai:
    ports: []
  rayk-server:
    environment:
      RAYK_DEVELOPMENT_LOGIN_ENABLED: "false"
      WECHAT_MOCK_ENABLED: "false"
      WECHAT_AUTO_BIND_USERNAME: ""
      MEMBERSHIP_PAYMENT_ENABLED: "true"
      # Keep the complete mall implementation available but hidden/disabled
      # until product, fulfilment and payment materials are ready.
      MALL_ENABLED: ${MALL_ENABLED:-false}
      # Physical-goods payment is deliberately opt-in until the standard API v3
      # merchant certificate, delivery process and refund handling are accepted.
      # Keep physical-goods payments off unless the deployment secret config
      # explicitly opts in after the merchant and fulfilment acceptance checks.
      MALL_PAYMENT_ENABLED: ${MALL_PAYMENT_ENABLED:-false}
      MALL_ORDER_EXPIRE_MINUTES: "30"
      JWT_EXPIRE_SECONDS: "604800"
      MINIO_PUBLIC_ENDPOINT: "https://xingxuyuan.com"
    ports: []
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./crets/xingxuyuan.com_nginx:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
