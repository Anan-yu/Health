services:
  mysql:
    ports: []
  redis:
    ports: []
  minio:
    ports: []
  rayk-ai:
    ports: []
  rayk-server:
    environment:
      RAYK_DEVELOPMENT_LOGIN_ENABLED: "false"
      WECHAT_MOCK_ENABLED: "false"
      WECHAT_AUTO_BIND_USERNAME: ""
      MINIO_PUBLIC_ENDPOINT: "https://xingxuyuantech.com"
    ports: []
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./crets/xingxuyuantech.com_nginx:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
