spring:
  application:
    name: rayk-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:rayk_health}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:rayk}
    password: ${MYSQL_PASSWORD:rayk_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:rayk_redis_dev_password}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:false}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

rayk:
  auth:
    # 账号体系模式：database=基于 sys_user/RBAC 表（默认）；mock=内存固定开发账号（仅本地调试）
    mode: ${RAYK_AUTH_MODE:database}
    # 仅本地开发环境允许账号密码调试入口；生产环境不注册该接口。
    development-login-enabled: ${RAYK_DEVELOPMENT_LOGIN_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:rayk_dev_only_secret_change_before_production_123456}
    expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    secret: ${WECHAT_APP_SECRET:}
    code2-session-url: ${WECHAT_CODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
    access-token-url: ${WECHAT_ACCESS_TOKEN_URL:https://api.weixin.qq.com/cgi-bin/token}
    phone-number-url: ${WECHAT_PHONE_NUMBER_URL:https://api.weixin.qq.com/wxa/business/getuserphonenumber}
    mock-enabled: ${WECHAT_MOCK_ENABLED:false}
    mock-openid: ${WECHAT_MOCK_OPENID:rayk-dev-openid}
    mock-phone-number: ${WECHAT_MOCK_PHONE_NUMBER:13800000005}
    default-customer-tenant-id: ${WECHAT_DEFAULT_CUSTOMER_TENANT_ID:20001}
    auto-bind-username: ${WECHAT_AUTO_BIND_USERNAME:}
    phone-login-required: ${WECHAT_PHONE_LOGIN_REQUIRED:false}
    # Optional bootstrap for the first platform administrator. Keep the phone in
    # deployment secrets; once logged in, it can be changed from the workbench.
    platform-admin-phone: ${WECHAT_PLATFORM_ADMIN_PHONE:}
    platform-admin-username: ${WECHAT_PLATFORM_ADMIN_USERNAME:admin}
  ai:
    base-url: ${RAYK_AI_BASE_URL:http://localhost:8000}
    connect-timeout-seconds: 5
    read-timeout-seconds: ${RAYK_AI_READ_TIMEOUT_SECONDS:600}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:rayk_minio}
    secret-key: ${MINIO_SECRET_KEY:rayk_minio_dev_password}
    bucket-reports: ${MINIO_BUCKET_REPORTS:rayk-reports}
    region: ${MINIO_REGION:us-east-1}
    presign-expiry-seconds: ${MINIO_PRESIGN_EXPIRY_SECONDS:600}
  task:
    processing-timeout-minutes: ${RAYK_TASK_PROCESSING_TIMEOUT_MINUTES:10}
    pending-timeout-minutes: ${RAYK_TASK_PENDING_TIMEOUT_MINUTES:2}
    recovery-interval-ms: ${RAYK_TASK_RECOVERY_INTERVAL_MS:60000}
  health-tree-hole:
    # Generate due seven-day summaries in the background; override for staging verification.
    feedback-cron: "${RAYK_HEALTH_TREE_HOLE_FEEDBACK_CRON:0 15 2 * * *}"
  health-shot:
    enabled: ${HEALTH_SHOT_ENABLED:false}
    app-id: ${HEALTH_SHOT_APP_ID:}
    key: ${HEALTH_SHOT_KEY:}
    api-base-url: ${HEALTH_SHOT_API_BASE_URL:https://api-uat.utours.cn}
    upload-path: ${HEALTH_SHOT_UPLOAD_PATH:/open-service/face-detect/upload-video}
    environment: ${HEALTH_SHOT_ENVIRONMENT:UAT}
    plugin-provider: ${HEALTH_SHOT_PLUGIN_PROVIDER:wx9ad841f52fa9bd7b}
    plugin-version: ${HEALTH_SHOT_PLUGIN_VERSION:latest}
    plugin-server-url: ${HEALTH_SHOT_PLUGIN_SERVER_URL:}
    connect-timeout-seconds: ${HEALTH_SHOT_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${HEALTH_SHOT_READ_TIMEOUT_SECONDS:120}
  tts:
    enabled: ${TENCENT_TTS_ENABLED:false}
    app-id: ${TENCENT_TTS_APP_ID:}
    secret-id: ${TENCENT_TTS_SECRET_ID:}
    secret-key: ${TENCENT_TTS_SECRET_KEY:}
    region: ${TENCENT_TTS_REGION:ap-guangzhou}
    female-voice-type: ${TENCENT_TTS_FEMALE_VOICE_TYPE:601012}
    male-voice-type: ${TENCENT_TTS_MALE_VOICE_TYPE:501005}
    speed: ${TENCENT_TTS_SPEED:-1}
    volume: ${TENCENT_TTS_VOLUME:0}
    sample-rate: ${TENCENT_TTS_SAMPLE_RATE:24000}
  membership:
    enabled: ${MEMBERSHIP_ENABLED:true}
    payment-enabled: ${MEMBERSHIP_PAYMENT_ENABLED:false}
    free-ai-assessment-trial: ${MEMBERSHIP_FREE_AI_ASSESSMENT_TRIAL:3}
    free-ai-report-trial: ${MEMBERSHIP_FREE_AI_REPORT_TRIAL:3}
    free-ai-followup-trial: ${MEMBERSHIP_FREE_AI_FOLLOWUP_TRIAL:1}
    free-health-shot-trial: ${MEMBERSHIP_FREE_HEALTH_SHOT_TRIAL:3}
    free-tts-meal-trial: ${MEMBERSHIP_FREE_TTS_MEAL_TRIAL:3}
    free-tts-sleep-trial: ${MEMBERSHIP_FREE_TTS_SLEEP_TRIAL:3}
    development-mode: ${MEMBERSHIP_DEVELOPMENT_MODE:false}
    wechat-pay:
      app-id: ${WECHAT_PAY_APP_ID:${WECHAT_APP_ID:}}
      merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
      merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
      private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      platform-public-key-id: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_ID:}
      platform-public-key-path: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:}
      notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    wechat-virtual-pay:
      app-id: ${WECHAT_VIRTUAL_APP_ID:${WECHAT_APP_ID:}}
      merchant-id: ${WECHAT_VIRTUAL_MERCHANT_ID:1116509042}
      offer-id: ${WECHAT_VIRTUAL_OFFER_ID:1450618433}
      app-key: ${WECHAT_VIRTUAL_APP_KEY:}
      sandbox-app-key: ${WECHAT_VIRTUAL_SANDBOX_APP_KEY:}
      env: ${WECHAT_VIRTUAL_ENV:0}
      mode: ${WECHAT_VIRTUAL_MODE:short_series_goods}
      product-id: ${WECHAT_VIRTUAL_PRODUCT_ID:}
      notify-url: "${WECHAT_VIRTUAL_NOTIFY_URL:https://xingxuyuan.com/api/payments/wechat/virtual/notify}"
  mall:
    enabled: ${MALL_ENABLED:false}
    payment-enabled: ${MALL_PAYMENT_ENABLED:false}
    order-expire-minutes: ${MALL_ORDER_EXPIRE_MINUTES:30}
  gold-bean:
    # The new 金豆/推荐等级 rules are a development pilot. Production keeps
    # this disabled until the business and compliance review is complete.
    enabled: ${GOLD_BEAN_ENABLED:false}
    development-mode: ${GOLD_BEAN_DEVELOPMENT_MODE:false}
    initial-beans: ${GOLD_BEAN_INITIAL_BEANS:60}
    daily-reward-beans: ${GOLD_BEAN_DAILY_REWARD_BEANS:60}
    daily-reward-days: ${GOLD_BEAN_DAILY_REWARD_DAYS:20}
    # These are business/settlement amounts. All gold-bean virtual-payment chains charge the
    # configured surcharge on top, while referral/seller merchant transfers keep these amounts.
    registration-fee-cent: ${GOLD_BEAN_REGISTRATION_FEE_CENT:100000}
    platform-registration-fee-cent: ${GOLD_BEAN_PLATFORM_REGISTRATION_FEE_CENT:100000}
    virtual-payment-surcharge-percent: ${GOLD_BEAN_VIRTUAL_PAYMENT_SURCHARGE_PERCENT:12}
    protection-days: ${GOLD_BEAN_PROTECTION_DAYS:7}
    limited-trade-percent: ${GOLD_BEAN_LIMITED_TRADE_PERCENT:50}
    payment-enabled: ${GOLD_BEAN_PAYMENT_ENABLED:false}
    registration-product-id: ${GOLD_BEAN_REGISTRATION_PRODUCT_ID:}
    # Referral registration uses a separate, approved virtual product. Keep it empty until the
    # product is configured and published at the actual payable price.
    referral-registration-product-id: ${GOLD_BEAN_REFERRAL_REGISTRATION_PRODUCT_ID:}
    gold-bean-product-id: ${GOLD_BEAN_PRODUCT_ID:}
    gold-bean-unit-price-cent: ${GOLD_BEAN_UNIT_PRICE_CENT:100}
    max-purchase-quantity: ${GOLD_BEAN_MAX_PURCHASE_QUANTITY:10000}
    # Member-to-member trades use the configured gold_bean virtual item, then merchant transfer
    # to the seller. Gold beans are delivered only after the transfer reaches SUCCESS.
    trade-payment-enabled: ${GOLD_BEAN_TRADE_PAYMENT_ENABLED:false}
    trade-transfer-scene-id: ${GOLD_BEAN_TRADE_TRANSFER_SCENE_ID:}
    trade-transfer-notify-url: ${GOLD_BEAN_TRADE_TRANSFER_NOTIFY_URL:}
    trade-transfer-user-recv-perception: ${GOLD_BEAN_TRADE_TRANSFER_USER_RECV_PERCEPTION:劳务报酬}
    trade-transfer-job-type: ${GOLD_BEAN_TRADE_TRANSFER_JOB_TYPE:金豆交易服务}
    trade-transfer-reward-description: ${GOLD_BEAN_TRADE_TRANSFER_REWARD_DESCRIPTION:金豆交易结算}
    trade-settlement-retry-seconds: ${GOLD_BEAN_TRADE_SETTLEMENT_RETRY_SECONDS:30}
    # Referral registration is paid to the platform merchant first, then settled to the
    # referrer's bound WeChat account through merchant transfer. Keep it opt-in per environment.
    registration-referral-transfer-enabled: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_ENABLED:false}
    registration-referral-transfer-scene-id: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_SCENE_ID:}
    registration-referral-transfer-notify-url: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_NOTIFY_URL:}
    registration-referral-authorization-notify-url: ${GOLD_BEAN_REGISTRATION_REFERRAL_AUTHORIZATION_NOTIFY_URL:}
    registration-referral-transfer-user-recv-perception: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_USER_RECV_PERCEPTION:劳务报酬}
    registration-referral-transfer-job-type: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_JOB_TYPE:推荐注册服务}
    registration-referral-transfer-reward-description: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_REWARD_DESCRIPTION:推荐注册服务报酬}
    # The robot entitlement is redeemed with digital-bank gold beans. An external enterprise-
    # WeChat customer-group QR image URL can rotate the live-code; when empty, the mini-program
    # uses its bundled QR image as the test/default group entry.
    robot-group-name: ${GOLD_BEAN_ROBOT_GROUP_NAME:机器人权益服务群}
    robot-group-qr-image-url: ${GOLD_BEAN_ROBOT_GROUP_QR_IMAGE_URL:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.rayk.health: INFO
