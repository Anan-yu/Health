services:
  # Explicit opt-in public HTTPS stack for real WeChat payment acceptance.
  # Values must come from the untracked .env or deployment secret manager.
  rayk-server:
    environment:
      RAYK_DEVELOPMENT_LOGIN_ENABLED: "true"
      WECHAT_MOCK_ENABLED: "false"
      WECHAT_PHONE_LOGIN_REQUIRED: ${WECHAT_PHONE_LOGIN_REQUIRED:-true}
      MEMBERSHIP_DEVELOPMENT_MODE: "true"
      MEMBERSHIP_PAYMENT_ENABLED: "true"
      GOLD_BEAN_ENABLED: "true"
      GOLD_BEAN_DEVELOPMENT_MODE: "true"
      GOLD_BEAN_PAYMENT_ENABLED: "true"
      GOLD_BEAN_REGISTRATION_FEE_CENT: ${GOLD_BEAN_REGISTRATION_FEE_CENT:-100000}
      GOLD_BEAN_PLATFORM_REGISTRATION_FEE_CENT: ${GOLD_BEAN_PLATFORM_REGISTRATION_FEE_CENT:-100000}
      GOLD_BEAN_VIRTUAL_PAYMENT_SURCHARGE_PERCENT: ${GOLD_BEAN_VIRTUAL_PAYMENT_SURCHARGE_PERCENT:-12}
      GOLD_BEAN_REGISTRATION_PRODUCT_ID: ${GOLD_BEAN_REGISTRATION_PRODUCT_ID:?GOLD_BEAN_REGISTRATION_PRODUCT_ID must be set for a real gold-bean registration test}
      GOLD_BEAN_REFERRAL_REGISTRATION_PRODUCT_ID: ${GOLD_BEAN_REFERRAL_REGISTRATION_PRODUCT_ID:?GOLD_BEAN_REFERRAL_REGISTRATION_PRODUCT_ID must be set for a real referral registration test}
      GOLD_BEAN_PRODUCT_ID: ${GOLD_BEAN_PRODUCT_ID:?GOLD_BEAN_PRODUCT_ID must be set for a real gold-bean purchase test}
      GOLD_BEAN_UNIT_PRICE_CENT: ${GOLD_BEAN_UNIT_PRICE_CENT:-100}
      GOLD_BEAN_MAX_PURCHASE_QUANTITY: ${GOLD_BEAN_MAX_PURCHASE_QUANTITY:-10000}
      GOLD_BEAN_TRADE_PAYMENT_ENABLED: "true"
      GOLD_BEAN_TRADE_TRANSFER_SCENE_ID: ${GOLD_BEAN_TRADE_TRANSFER_SCENE_ID:?GOLD_BEAN_TRADE_TRANSFER_SCENE_ID must be set for member trade payout}
      GOLD_BEAN_TRADE_TRANSFER_NOTIFY_URL: ${GOLD_BEAN_TRADE_TRANSFER_NOTIFY_URL:-}
      GOLD_BEAN_TRADE_TRANSFER_USER_RECV_PERCEPTION: ${GOLD_BEAN_TRADE_TRANSFER_USER_RECV_PERCEPTION:-劳务报酬}
      GOLD_BEAN_TRADE_TRANSFER_JOB_TYPE: ${GOLD_BEAN_TRADE_TRANSFER_JOB_TYPE:-金豆交易服务}
      GOLD_BEAN_TRADE_TRANSFER_REWARD_DESCRIPTION: ${GOLD_BEAN_TRADE_TRANSFER_REWARD_DESCRIPTION:-金豆交易结算}
      GOLD_BEAN_TRADE_SETTLEMENT_RETRY_SECONDS: ${GOLD_BEAN_TRADE_SETTLEMENT_RETRY_SECONDS:-30}
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_ENABLED: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_ENABLED:-false}
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_SCENE_ID: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_SCENE_ID:-}
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_NOTIFY_URL: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_NOTIFY_URL:-}
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_USER_RECV_PERCEPTION: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_USER_RECV_PERCEPTION:-劳务报酬}
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_JOB_TYPE: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_JOB_TYPE:-推荐注册服务}
      GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_REWARD_DESCRIPTION: ${GOLD_BEAN_REGISTRATION_REFERRAL_TRANSFER_REWARD_DESCRIPTION:-推荐注册服务报酬}
      GOLD_BEAN_ROBOT_GROUP_NAME: ${GOLD_BEAN_ROBOT_GROUP_NAME:-机器人权益服务群}
      GOLD_BEAN_ROBOT_GROUP_QR_IMAGE_URL: ${GOLD_BEAN_ROBOT_GROUP_QR_IMAGE_URL:-}
      MALL_ENABLED: "true"
      # Physical goods use standard WeChat Pay API v3 JSAPI, not virtual payment.
      MALL_PAYMENT_ENABLED: "true"
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:?WECHAT_PAY_APP_ID must be set for a physical-goods payment test}
      WECHAT_PAY_MERCHANT_ID: ${WECHAT_PAY_MERCHANT_ID:?WECHAT_PAY_MERCHANT_ID must be set for a physical-goods payment test}
      WECHAT_PAY_MERCHANT_SERIAL_NUMBER: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:?WECHAT_PAY_MERCHANT_SERIAL_NUMBER must be set for a physical-goods payment test}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-/run/secrets/wechatpay/apiclient_key.pem}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:?WECHAT_PAY_API_V3_KEY must be set for a physical-goods payment test}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:?WECHAT_PAY_NOTIFY_URL must be set for a physical-goods payment test}
      MALL_ORDER_EXPIRE_MINUTES: ${MALL_ORDER_EXPIRE_MINUTES:-30}
      WECHAT_VIRTUAL_APP_ID: ${WECHAT_VIRTUAL_APP_ID:-wxf6f4549c8c962948}
      WECHAT_VIRTUAL_MERCHANT_ID: ${WECHAT_VIRTUAL_MERCHANT_ID:-1116509042}
      WECHAT_VIRTUAL_OFFER_ID: ${WECHAT_VIRTUAL_OFFER_ID:-1450618433}
      WECHAT_VIRTUAL_APP_KEY: ${WECHAT_VIRTUAL_APP_KEY:?WECHAT_VIRTUAL_APP_KEY must be set for a real payment test}
      WECHAT_VIRTUAL_SANDBOX_APP_KEY: ${WECHAT_VIRTUAL_SANDBOX_APP_KEY:-}
      WECHAT_VIRTUAL_ENV: ${WECHAT_VIRTUAL_ENV:-0}
      WECHAT_VIRTUAL_MODE: ${WECHAT_VIRTUAL_MODE:-short_series_goods}
      WECHAT_VIRTUAL_PRODUCT_ID: ${WECHAT_VIRTUAL_PRODUCT_ID:?WECHAT_VIRTUAL_PRODUCT_ID must be set for a real payment test}
      WECHAT_VIRTUAL_NOTIFY_URL: ${WECHAT_VIRTUAL_NOTIFY_URL:-https://xingxuyuan.com/api/payments/wechat/virtual/notify}
      WECHAT_VIRTUAL_PUSH_TOKEN: ${WECHAT_VIRTUAL_PUSH_TOKEN:-}
      GOLD_BEAN_REGISTRATION_REFERRAL_AUTHORIZATION_NOTIFY_URL: ${GOLD_BEAN_REGISTRATION_REFERRAL_AUTHORIZATION_NOTIFY_URL:-}
      MINIO_PUBLIC_ENDPOINT: "https://xingxuyuan.com"

  nginx:
    ports:
      - "${REAL_PAYMENT_HTTP_PORT:-80}:80"
      - "${REAL_PAYMENT_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./crets/xingxuyuan.com_nginx:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
