user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain;
  client_max_body_size 0;
  proxy_connect_timeout 10s;
  proxy_read_timeout 60s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream rayk_server_backend {
    zone rayk_server_backend 64k;
    server rayk-server:8080 resolve;
  }

  upstream rayk_ai_backend {
    zone rayk_ai_backend 64k;
    server rayk-ai:8000 resolve;
  }

  upstream minio_backend {
    zone minio_backend 64k;
    server minio:9000 resolve;
  }

  map $http_x_request_id $request_id_header {
    default $http_x_request_id;
    "" $request_id;
  }

  server {
    listen 80;
    server_name xingxuyuantech.com www.xingxuyuantech.com;

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"UP"}';
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name xingxuyuantech.com www.xingxuyuantech.com;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/xingxuyuantech.com_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/xingxuyuantech.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-Id $request_id_header always;

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"UP"}';
    }

    location /api/ {
      proxy_pass http://rayk_server_backend;
      proxy_set_header X-Request-Id $request_id_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_read_timeout 90s;
    }

    location /ai/ {
      rewrite ^/ai/(.*)$ /$1 break;
      proxy_pass http://rayk_ai_backend;
      proxy_set_header X-Request-Id $request_id_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    location /minio/ {
      rewrite ^/minio/(.*)$ /$1 break;
      proxy_pass http://minio_backend;
      proxy_set_header X-Request-Id $request_id_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
    }

    # MinIO presigned URLs are rooted at /<bucket>/<object>; proxy the
    # private reports bucket without exposing the MinIO service port.
    location ^~ /rayk-reports/ {
      proxy_pass http://minio_backend;
      proxy_set_header X-Request-Id $request_id_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
