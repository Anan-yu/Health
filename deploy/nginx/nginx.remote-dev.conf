user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain;
  client_max_body_size 0;
  proxy_connect_timeout 10s;
  proxy_read_timeout 90s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream remote_dev_server_backend {
    zone remote_dev_server_backend 64k;
    server rayk-server:8080 resolve;
  }

  upstream remote_dev_ai_backend {
    zone remote_dev_ai_backend 64k;
    server rayk-ai:8000 resolve;
  }

  upstream remote_dev_minio_backend {
    zone remote_dev_minio_backend 64k;
    server minio:9000 resolve;
  }

  map $http_x_request_id $request_id_header {
    default $http_x_request_id;
    "" $request_id;
  }

  server {
    listen 80;
    server_name _;

    location = /health {
      access_log off;
      default_type application/json;
      proxy_pass http://remote_dev_server_backend/actuator/health;
      proxy_set_header X-Request-Id $request_id_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
    }

    location ^~ /api/client/medical-assistant/ {
      proxy_pass http://remote_dev_server_backend;
      proxy_set_header X-Request-Id $request_id_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }

    location /api/ {
      proxy_pass http://remote_dev_server_backend;
      proxy_set_header X-Request-Id $request_id_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_read_timeout 90s;
    }

    location /ai/ {
      rewrite ^/ai/(.*)$ /$1 break;
      proxy_pass http://remote_dev_ai_backend;
      proxy_set_header X-Request-Id $request_id_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    location /minio/ {
      rewrite ^/minio/(.*)$ /$1 break;
      proxy_pass http://remote_dev_minio_backend;
      proxy_set_header X-Request-Id $request_id_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
    }

    location ^~ /rayk-remote-dev-reports/ {
      proxy_pass http://remote_dev_minio_backend;
      proxy_set_header X-Request-Id $request_id_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
    }

    location ^~ /rayk-reports/ {
      proxy_pass http://remote_dev_minio_backend;
      proxy_set_header X-Request-Id $request_id_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
    }

    location / {
      return 404;
    }
  }
}
